# Configuration kitty de départ (copiée une fois par Home Manager, ensuite libre).
# La CLI Caelestia écrira ses couleurs dans theme.conf lors des changements
# de fond d'écran.

font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font     auto
bold_italic_font auto
font_size        11.0

window_padding_width 8
confirm_os_window_close 0
enable_audio_bell no

shell_integration enabled

include theme.conf
